# Deltazium — Kafka Connect 단일 워커 (distributed 모드)
# ${...} 자리는 start-infra.sh가 envsubst로 렌더링해 $DZ_RT/conf/에 생성한다.
bootstrap.servers=localhost:${DZ_KAFKA_PORT}
group.id=deltazium-connect

# converter: JSON + 스키마 포함 (architecture.md 3절 확정)
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true

# 내부 토픽 (단일 노드라 replication 1)
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
config.storage.topic=connect-configs
config.storage.replication.factor=1
status.storage.topic=connect-status
status.storage.replication.factor=1

listeners=HTTP://:${DZ_CONNECT_PORT}
plugin.path=${DZ_PLUGIN_PATH}

# sink는 항상 토픽 처음부터 소비 — 커넥터 생성 시점보다 먼저 발행된 레코드 유실 방지
consumer.auto.offset.reset=earliest

# 워커가 하나뿐이라 lost 워커의 태스크가 다른 워커로 넘어갈 일이 없다 —
# 기본값(5분) 그대로면 워커 재기동 후 태스크 재배정을 5분씩 기다리게 되므로 단축한다.
scheduled.rebalance.max.delay.ms=30000
