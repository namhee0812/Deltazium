# Deltazium — Kafka KRaft 단일 노드 (broker+controller 겸용)
# ${...} 자리는 start-infra.sh가 envsubst로 렌더링해 $DZ_RT/conf/에 생성한다.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:${DZ_KAFKA_CONTROLLER_PORT}

listeners=PLAINTEXT://:${DZ_KAFKA_PORT},CONTROLLER://:${DZ_KAFKA_CONTROLLER_PORT}
advertised.listeners=PLAINTEXT://localhost:${DZ_KAFKA_PORT}
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

log.dirs=${DZ_KAFKA_DATA}

# 단일 노드 전제
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Kafka는 짧은 버퍼 (architecture.md 2.1절) — 이력 보관은 Iceberg 책임
log.retention.hours=24
num.partitions=1
