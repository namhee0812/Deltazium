plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // 메타데이터(PG) 쿼리는 MyBatis 매퍼 XML로 관리 (2026-07-29 결정)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    runtimeOnly 'org.postgresql:postgresql'
    // Oracle 연결 테스트용 (Debezium 플러그인과 동일 계열 드라이버)
    implementation 'com.oracle.database.jdbc:ojdbc11:23.26.2.0.0'
    // 토픽 오프셋·consumer lag 실측 + DDL 이벤트(schema change topic) 소비
    implementation 'org.apache.kafka:kafka-clients'
    // Iceberg changelog 테이블 사전 생성 (5.1절 개정: backend가 생성, sink는 append만)
    implementation 'org.apache.iceberg:iceberg-core:1.11.0'
    implementation 'org.apache.iceberg:iceberg-aws:1.11.0'
    // changelog 현황(파티션 메타데이터 테이블) 읽기용 — data가 포맷 레지스트리 초기화 시 parquet·orc 클래스를 요구
    implementation 'org.apache.iceberg:iceberg-data:1.11.0'
    runtimeOnly 'org.apache.iceberg:iceberg-parquet:1.11.0'
    runtimeOnly 'org.apache.iceberg:iceberg-orc:1.11.0'
    runtimeOnly 'org.apache.iceberg:iceberg-aws-bundle:1.11.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testRuntimeOnly 'com.h2database:h2:2.4.240'
}
