spring:
  datasource:
    # 테스트는 H2 PostgreSQL 모드 — 런타임 PG(5433) 기동 여부와 무관하게 빌드 가능해야 한다
    url: jdbc:h2:mem:deltazium-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mappers/*.xml

# 테스트 리소스의 application.yml은 메인 것을 대체하므로 필수 커스텀 키를 함께 정의한다
deltazium:
  ddl-poller:
    enabled: false   # 단위 테스트는 Kafka 없이 돈다
  connect:
    base-url: http://localhost:8083
  connectors:
    template-dir: ../connectors
  kafka:
    bootstrap: localhost:9092
  topic-prefix: dz
  runtime-dir: /tmp
  disk-warn-pct: 85
  iceberg:
    catalog-uri: jdbc:postgresql://localhost:5433/iceberg_catalog
    catalog-user: deltazium
    catalog-password: deltazium
    warehouse: s3://deltazium-warehouse/warehouse
    s3-endpoint: http://localhost:9010
    s3-access-key: deltazium
    s3-secret-key: deltazium123
  assist:
    log-dir: /tmp
  recovery:
    launcher: /tmp/recovery-job-test
    log-dir: /tmp
