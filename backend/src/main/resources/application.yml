server:
  port: 8090   # 8080은 이 서버의 기존 서비스가 사용 중

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/deltazium
    username: deltazium
    password: ""
  sql:
    init:
      mode: always   # schema.sql은 IF NOT EXISTS라 재기동 안전

mybatis:
  mapper-locations: classpath:mappers/*.xml

deltazium:
  connect:
    base-url: http://localhost:8083
  connectors:
    # 커넥터 템플릿 디렉터리 (repo의 connectors/). 상대 경로는 실행 위치 기준.
    template-dir: ../connectors
  kafka:
    bootstrap: localhost:9092
  # Debezium topic.prefix — 토픽명은 <prefix>.<schema>.<table>
  topic-prefix: dz
  # 워치독·경고 센터(SystemWarningService) 디스크 사용률 판정 대상 경로 — deploy/env.sh DZ_RT와 일치
  runtime-dir: ${DZ_RT:${user.home}/deltazium-runtime}
  disk-warn-pct: 85
  # changelog 저장소 (Deltazium 자체 인프라 — 사용자 등록 대상 아님, deploy/env.sh와 일치)
  iceberg:
    catalog-uri: jdbc:postgresql://localhost:5433/iceberg_catalog
    catalog-user: deltazium
    catalog-password: deltazium
    warehouse: s3://deltazium-warehouse/warehouse
    s3-endpoint: http://localhost:9010
    s3-access-key: deltazium
    s3-secret-key: deltazium123
    # namespace는 설정하지 않는다 — ChangelogTableService가 topic-prefix에서
    # changelog_<prefix>로 계산한다 (다중 소스 대응, architecture.md 5.1절)
  assist:
    # AI 진단 어시스턴트 로그 검색 루트 — 인프라 전 컴포넌트 로그를 읽는다.
    # recovery.log-dir(복구 잡 출력 경로)과 용도가 다르므로 분리한다.
    log-dir: ${DZ_LOG_DIR:${user.home}/deltazium-runtime/logs}
    # overview에서 lagging으로 분류하는 임계값 — offset 건수 (시간 아님)
    lag-threshold: 1000
  chat:
    # AI 진단 어시스턴트 모델. opus 대비 sonnet이 절반 이하 단가 — 품질 비교 후 확정 (2026-08-13)
    model: claude-sonnet-5
  recovery:
    # recovery-job 실행 스크립트 (gradle :recovery-job:installDist 산출물)
    launcher: ../recovery-job/build/install/recovery-job/bin/recovery-job
    log-dir: ${user.home}/deltazium-runtime/logs

# 로그: 일 단위 롤오버 — 지난 날짜는 logs/yyyy-MM-dd/ 디렉터리로 이동 (인프라 로그 정책과 동일)
logging:
  file:
    name: ${DZ_LOG_DIR:${user.home}/deltazium-runtime/logs}/backend.log
  logback:
    rollingpolicy:
      file-name-pattern: ${DZ_LOG_DIR:${user.home}/deltazium-runtime/logs}/%d{yyyy-MM-dd}/backend-%i.log
      max-file-size: 100MB
      max-history: 14
