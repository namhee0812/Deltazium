subprojects {
    apply plugin: 'java'

    group = 'io.deltazium'
    version = '0.1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // 통합 테스트 스위치(-Dintegration=true)를 테스트 JVM으로 전달
        systemProperty 'integration', System.getProperty('integration', 'false')
    }
}
